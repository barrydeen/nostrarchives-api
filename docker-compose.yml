services:
  postgres:
    image: postgres:16-alpine
    # Docker defaults /dev/shm to 64MB, which is too small for parallel workers
    # on tables this size — REFRESH MATERIALIZED VIEW and VACUUM both fail with
    # "could not resize shared memory segment ... No space left on device".
    shm_size: 1gb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: nostr_api
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d nostr_api"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
